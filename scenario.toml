[green_agent]
agentbeats_id = "019bc450-9926-7f51-a195-3be6e03222e0"
# Secrets should use ${VARIABLE_NAME} syntax so submitters can provide them.
env = {
  AZURE_OPENAI_API_KEY = "${AZURE_OPENAI_API_KEY}",
  AZURE_OPENAI_ENDPOINT = "${AZURE_OPENAI_ENDPOINT}",
  AZURE_OPENAI_DEPLOYMENT = "${AZURE_OPENAI_DEPLOYMENT}",
  AZURE_OPENAI_API_VERSION = "${AZURE_OPENAI_API_VERSION}"
}

[[participants]]
# Leave blank in main; fill this in per run when triggering assessments.
agentbeats_id = ""
name = "netheal-solver"
env = {
  LLM_PROVIDER = "${LLM_PROVIDER}",
  LLM_MODEL = "${LLM_MODEL}",
  OPENAI_API_KEY = "${OPENAI_API_KEY}",
  OPENAI_MODEL = "${OPENAI_MODEL}",
  OPENAI_BASE_URL = "${OPENAI_BASE_URL}",
  OPENAI_ORG_ID = "${OPENAI_ORG_ID}",
  AZURE_OPENAI_API_KEY = "${AZURE_OPENAI_API_KEY}",
  AZURE_OPENAI_ENDPOINT = "${AZURE_OPENAI_ENDPOINT}",
  AZURE_OPENAI_DEPLOYMENT = "${AZURE_OPENAI_DEPLOYMENT}",
  AZURE_OPENAI_API_VERSION = "${AZURE_OPENAI_API_VERSION}",
  ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}",
  ANTHROPIC_MODEL = "${ANTHROPIC_MODEL}",
  ANTHROPIC_API_URL = "${ANTHROPIC_API_URL}",
  AWS_REGION = "${AWS_REGION}",
  AWS_ACCESS_KEY_ID = "${AWS_ACCESS_KEY_ID}",
  AWS_SECRET_ACCESS_KEY = "${AWS_SECRET_ACCESS_KEY}",
  AWS_SESSION_TOKEN = "${AWS_SESSION_TOKEN}",
  BEDROCK_MODEL_ID = "${BEDROCK_MODEL_ID}",
  REASONING_EFFORT = "${REASONING_EFFORT}",
}

[config]
num_episodes = 100
min_devices = 3
max_devices = 15
max_episode_steps = 100
topology_types = ["star", "mesh", "hierarchical"]
timeout_seconds = 600
seed = 1234
enable_user_hints = true
use_snapshots = true
snapshot_path = "snapshots/v1/"
fault_sampling_strategy = "uniform"
fault_weights = { device_failure = 0.25, link_failure = 0.25, misconfiguration = 0.25, performance_degradation = 0.25 }
latency_multiplier_range = [10.0, 20.0]
episode_concurrency = 25
episode_retry_limit = 3
max_timeouts = 50
max_errors = 50
extra_env_options = { hint_provider_mode = "heuristic" }
